name: Create NEON DODGE Signing Key

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Create signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore neon-dodge-release.jks \
            -alias neon-dodge \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 20fe06da \
            -keypass 20fe06da \
            -dname "CN=NEON DODGE, OU=Game, O=FXD, L=Almaty, ST=Almaty, C=KZ"

      - name: Show SHA-1
        run: |
          keytool -list -v \
            -keystore neon-dodge-release.jks \
            -alias neon-dodge \
            -storepass NEONDODGE2026 | grep "SHA1:"

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DODGE-SIGNING-KEY
          path: neon-dodge-release.jks