name: Build NEON DODGE Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # NODE
      # =====================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =====================================================
      # PREPARE WEB FILES
      # =====================================================
      - name: Prepare web files
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/
          cp style.css www/
          cp game.js www/
          cp audio.js www/

          echo "========================================="
          echo "WEB FILES"
          echo "========================================="
          ls -lah www/


      # =====================================================
      # CREATE NODE PROJECT
      # =====================================================
      - name: Create Node project
        run: |
          set -e

          npm init -y

          npm install \
            @capacitor/core@8.0.0 \
            @capacitor/cli@8.0.0 \
            @capacitor/android@8.0.0 \
            @capacitor-community/admob@8.0.0 \
            esbuild


      # =====================================================
      # BUILD ADMOB JAVASCRIPT BRIDGE
      # =====================================================
      - name: Build AdMob JavaScript bridge
        run: |
          set -e

          cat > admob-bridge.js <<'EOF'
          import { AdMob } from "@capacitor-community/admob";

          window.AdMob = AdMob;

          if (window.Capacitor) {
            if (!window.Capacitor.Plugins) {
              window.Capacitor.Plugins = {};
            }

            window.Capacitor.Plugins.AdMob = AdMob;
          }

          console.log("NEON DODGE: AdMob JavaScript bridge loaded");
          console.log("NEON DODGE: AdMob object:", AdMob);
          EOF

          npx esbuild admob-bridge.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=www/admob-bridge.js

          echo "========================================="
          echo "ADMOB BRIDGE CREATED"
          echo "========================================="

          ls -lh www/admob-bridge.js

          grep -q "AdMob" www/admob-bridge.js

          echo "AdMob bridge verification: OK"


      # =====================================================
      # INSERT ADMOB BRIDGE INTO INDEX.HTML
      # =====================================================
      - name: Connect AdMob bridge to index.html
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("www/index.html")
          text = path.read_text()

          bridge = '<script src="admob-bridge.js"></script>'

          if "admob-bridge.js" not in text:
              marker = '<script src="game.js"></script>'

              if marker in text:
                  text = text.replace(
                      marker,
                      bridge + "\n" + marker
                  )
              else:
                  text = text.replace(
                      "</body>",
                      bridge + "\n</body>"
                  )

          path.write_text(text)

          print("AdMob bridge connected to index.html")
          PY

          echo "========================================="
          echo "INDEX.HTML SCRIPTS"
          echo "========================================="

          grep -n "script" www/index.html


      # =====================================================
      # VERIFY WEB ADMOB BRIDGE
      # =====================================================
      - name: Verify web AdMob bridge
        run: |
          set -e

          echo "========================================="
          echo "VERIFYING ADMOB WEB BRIDGE"
          echo "========================================="

          test -f www/admob-bridge.js

          grep -q "AdMob" www/admob-bridge.js

          grep -q "admob-bridge.js" www/index.html

          echo ""
          echo "admob-bridge.js: FOUND"
          echo "index.html connection: FOUND"
          echo "AdMob JavaScript bridge: OK"


      # =====================================================
      # CREATE CAPACITOR PROJECT
      # =====================================================
      - name: Create Capacitor project
        run: |
          set -e

          npx cap init \
            "NEON DODGE" \
            "com.fxd.neondodge" \
            --web-dir=www

          npx cap add android


      # =====================================================
      # CONFIGURE ADMOB ANDROID APP ID
      # =====================================================
      - name: Configure AdMob Android App ID
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          APP_ID = "ca-app-pub-7914086624525579~8190565290"

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          # =================================================
          # STRINGS.XML
          # =================================================

          strings_text = strings.read_text()

          admob_string = (
              f'<string name="admob_app_id">{APP_ID}</string>'
          )

          if 'name="admob_app_id"' in strings_text:
              strings_text = re.sub(
                  r'<string\s+name="admob_app_id">.*?</string>',
                  admob_string,
                  strings_text
              )
          else:
              strings_text = strings_text.replace(
                  "</resources>",
                  f"    {admob_string}\n</resources>"
              )

          strings.write_text(strings_text)

          # =================================================
          # ANDROID MANIFEST
          # =================================================

          manifest_text = manifest.read_text()

          meta = """
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="@string/admob_app_id" />
          """

          if "com.google.android.gms.ads.APPLICATION_ID" not in manifest_text:
              manifest_text = manifest_text.replace(
                  "</application>",
                  f"{meta}\n    </application>"
              )

          manifest.write_text(manifest_text)

          print("AdMob App ID configured.")
          PY


      # =====================================================
      # VERIFY ADMOB ANDROID CONFIG
      # =====================================================
      - name: Verify AdMob Android configuration
        run: |
          set -e

          echo "========================================="
          echo "ADMOB ANDROID CONFIGURATION"
          echo "========================================="

          echo ""
          echo "App ID:"
          grep -R \
            "ca-app-pub-7914086624525579~8190565290" \
            android/app/src/main

          echo ""
          echo "APPLICATION_ID:"
          grep -R \
            "com.google.android.gms.ads.APPLICATION_ID" \
            android/app/src/main

          echo ""
          echo "AdMob plugin:"
          npm list @capacitor-community/admob

          echo ""
          echo "Capacitor:"
          npx cap ls


      # =====================================================
      # COPY WEB FILES
      # =====================================================
      - name: Copy web files
        run: |
          set -e

          npx cap copy android


      # =====================================================
      # SYNC CAPACITOR
      # =====================================================
      - name: Sync Capacitor
        run: |
          set -e

          npx cap sync android


      # =====================================================
      # VERIFY AFTER SYNC
      # =====================================================
      - name: Verify Android after Capacitor sync
        run: |
          set -e

          echo "========================================="
          echo "ANDROID PROJECT AFTER SYNC"
          echo "========================================="

          echo ""
          echo "Capacitor plugins:"
          npx cap ls

          echo ""
          echo "AdMob files:"
          find android \
            -type f \
            | grep -i "admob" \
            | head -50 || true

          echo ""
          echo "AdMob App ID:"
          grep -R \
            "ca-app-pub-7914086624525579~8190565290" \
            android/app/src/main \
            || true

          echo ""
          echo "APPLICATION_ID:"
          grep -R \
            "com.google.android.gms.ads.APPLICATION_ID" \
            android/app/src/main \
            || true


      # =====================================================
      # VERIFY WEB FILES INSIDE ANDROID
      # =====================================================
      - name: Verify web files inside Android
        run: |
          set -e

          echo "========================================="
          echo "ANDROID WEB ASSETS"
          echo "========================================="

          find android/app/src/main/assets/public \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

          echo ""
          echo "Checking AdMob bridge..."

          test -f android/app/src/main/assets/public/admob-bridge.js

          grep -q "AdMob" \
            android/app/src/main/assets/public/admob-bridge.js

          echo "AdMob bridge inside APK assets: OK"


      # =====================================================
      # JAVA
      # =====================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # =====================================================
      # GRADLE EXECUTABLE
      # =====================================================
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew


      # =====================================================
      # CLEAN
      # =====================================================
      - name: Clean Android build
        run: |
          cd android
          ./gradlew clean


      # =====================================================
      # BUILD APK
      # =====================================================
      - name: Build APK
        run: |
          cd android

          ./gradlew assembleDebug --stacktrace


      # =====================================================
      # VERIFY APK
      # =====================================================
      - name: Verify APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================="
          echo "APK INFORMATION"
          echo "========================================="

          test -f "$APK"

          ls -lh "$APK"

          echo ""
          echo "APK SHA256:"

          sha256sum "$APK"


      # =====================================================
      # UPLOAD APK
      # =====================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DODGE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk