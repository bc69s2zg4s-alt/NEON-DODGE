name: Build NEON DODGE Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm init -y
          npm install \
            @capacitor/core@8.0.0 \
            @capacitor/cli@8.0.0 \
            @capacitor/android@8.0.0 \
            @capacitor-community/admob@8.0.0
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp game.js www/
          cp audio.js www/
      - name: Create Capacitor project
        run: |
          npx cap init "NEON DODGE" "com.fxd.neondodge" --web-dir=www
          npx cap add android
      - name: Configure AdMob
        run: |
          python3 <<'PY'
          from pathlib import Path
          APP_ID = "ca-app-pub-7914086624525579~8190565290"
          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )
          text = strings.read_text()
          text = text.replace(
              "</resources>",
              f'    <string name="admob_app_id">{APP_ID}</string>\n</resources>'
          )
          strings.write_text(text)
          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )
          text = manifest.read_text()
          meta = """
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="@string/admob_app_id" />
          """
          text = text.replace(
              "</application>",
              meta + "\n    </application>"
          )
          manifest.write_text(text)
          PY
      - name: Copy web files
        run: |
          npx cap copy android
      - name: Sync Capacitor
        run: |
          npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew
      - name: Clean
        run: |
          cd android
          ./gradlew clean
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DODGE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk