name: Build NEON DODGE Release
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare project
        run: |
          npm init -y
          npm install \
            @capacitor/core@8.0.0 \
            @capacitor/cli@8.0.0 \
            @capacitor/android@8.0.0 \
            @capacitor-community/admob@8.0.0 \
            esbuild
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp game.js www/
          cp audio.js www/
      - name: Create AdMob bridge
        run: |
          cat > admob-bridge.js <<'EOF'
          import { AdMob } from "@capacitor-community/admob";
          window.__NEON_DODGE_ADMOB__ = AdMob;
          console.log("NEON DODGE: NATIVE ADMOB BRIDGE READY");
          EOF
          npx esbuild admob-bridge.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=www/admob-bridge.js
      - name: Inject AdMob bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text()
          bridge = '<script src="admob-bridge.js"></script>'
          if "admob-bridge.js" not in s:
              if '<script src="audio.js"></script>' in s:
                  s = s.replace(
                      '<script src="audio.js"></script>',
                      bridge + '\n<script src="audio.js"></script>'
                  )
              else:
                  s = s.replace(
                      '</body>',
                      bridge + '\n</body>'
                  )
          p.write_text(s)
          PY
      - name: Fix AdMob connection in game.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/game.js")
          s = p.read_text()
          old = '''function getAdMob() {
              return window.Capacitor?.Plugins?.AdMob || null;
          }'''
          new = '''function getAdMob() {
              return (
                  window.__NEON_DODGE_ADMOB__ ||
                  window.Capacitor?.Plugins?.AdMob ||
                  null
              );
          }'''
          if old in s:
              s = s.replace(old, new)
          old_interstitial = '''if (
              shouldShowInterstitial &&
              AdMob
          ) {'''
          new_interstitial = '''if (
              shouldShowInterstitial &&
              getAdMob()
          ) {'''
          if old_interstitial in s:
              s = s.replace(
                  old_interstitial,
                  new_interstitial
              )
          p.write_text(s)
          PY
      - name: Initialize Capacitor
        run: |
          npx cap init \
            "NEON DODGE" \
            "com.fxd.neondodge" \
            --web-dir www
      - name: Add Android
        run: |
          npx cap add android
      - name: Configure Android AdMob
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">NEON DODGE</string>
              <string name="title_activity_main">NEON DODGE</string>
              <string name="admob_app_id">ca-app-pub-7914086624525579~8190565290</string>
          </resources>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )
          s = manifest.read_text()
          meta = '''
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="@string/admob_app_id" />
          '''
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace(
                  "</application>",
                  meta + "\n    </application>"
              )
          manifest.write_text(s)
          PY
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > neondodge-release.keystore
          test -s neondodge-release.keystore
          echo "Keystore restored successfully."
      - name: Configure Release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs" not in s:
              signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("../../neondodge-release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              '''
              s = s.replace(
                  "android {",
                  "android {\n" + signing_block,
                  1
              )
          if "signingConfig signingConfigs.release" not in s:
              old_release = '''release {
                  minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
              }'''
              new_release = '''release {
                  minifyEnabled false
                  signingConfig signingConfigs.release
                  proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
              }'''
              if old_release in s:
                  s = s.replace(
                      old_release,
                      new_release,
                      1
                  )
              else:
                  print("WARNING: Standard release block not found.")
          p.write_text(s)
          PY
      - name: Sync Capacitor
        run: |
          npx cap copy android
          npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew bundleRelease --stacktrace
      - name: Verify AAB
        run: |
          echo "Checking Release AAB..."
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab
          echo "AAB BUILD SUCCESSFUL!"
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DODGE-RELEASE-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab