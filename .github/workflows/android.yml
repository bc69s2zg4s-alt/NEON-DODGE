name: Build NEON DODGE Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare project
        run: |
          npm init -y
          npm install @capacitor/core@8.0.0 @capacitor/cli@8.0.0 @capacitor/android@8.0.0 @capacitor-community/admob@8.0.0 esbuild
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp game.js www/
          cp audio.js www/
      - name: Create native AdMob bridge
        run: |
          cat > admob-bridge.js <<'EOF'
          import { AdMob } from "@capacitor-community/admob";
          window.__NEON_DODGE_ADMOB__ = AdMob;
          window.dispatchEvent(
            new CustomEvent("neon-admob-ready")
          );
          console.log("NEON DODGE: NATIVE ADMOB BRIDGE READY");
          EOF
          npx esbuild admob-bridge.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=www/admob-bridge.js
      - name: Inject AdMob bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text()
          if "admob-bridge.js" not in s:
              s = s.replace(
                  '<script src="audio.js"></script>',
                  '<script src="admob-bridge.js"></script>\n'
                  '<script src="audio.js"></script>'
              )
          p.write_text(s)
          PY
      - name: Fix game AdMob connection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/game.js")
          s = p.read_text()
          old = '''function getAdMob() {
              return window.Capacitor?.Plugins?.AdMob || null;
          }'''
          new = '''function getAdMob() {
              return (
                  window.__NEON_DODGE_ADMOB__ ||
                  window.Capacitor?.Plugins?.AdMob ||
                  null
              );
          }'''
          if old in s:
              s = s.replace(old, new)
          s = s.replace(
              '''if (
              shouldShowInterstitial &&
              AdMob
          ) {''',
              '''if (
              shouldShowInterstitial &&
              getAdMob()
          ) {'''
          )
          p.write_text(s)
          PY
      - name: Capacitor init
        run: |
          npx cap init "NEON DODGE" "com.fxd.neondodge" --web-dir www
      - name: Add Android
        run: |
          npx cap add android
      - name: Configure AdMob App ID
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">NEON DODGE</string>
              <string name="admob_app_id">ca-app-pub-7914086624525579~8190565290</string>
          </resources>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          meta = '''
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="@string/admob_app_id" />
          '''
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("</application>", meta + "\n    </application>")
          p.write_text(s)
          PY
      - name: Sync Capacitor
        run: |
          npx cap copy android
          npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DODGE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk