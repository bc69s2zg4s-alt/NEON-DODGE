name: Build NEON DODGE Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =====================================================
      # PREPARE WEB FILES
      # =====================================================

      - name: Prepare web files
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/
          cp style.css www/
          cp game.js www/
          cp audio.js www/

          echo "========================================="
          echo "WEB FILES"
          echo "========================================="

          ls -lah www/


      # =====================================================
      # CREATE CAPACITOR PROJECT
      # =====================================================

      - name: Create Capacitor project
        run: |
          set -e

          npm init -y

          npm install \
            @capacitor/core@8.0.0 \
            @capacitor/cli@8.0.0 \
            @capacitor/android@8.0.0 \
            @capacitor-community/admob@8.0.0

          echo "========================================="
          echo "INSTALLED PACKAGES"
          echo "========================================="

          npm list \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor-community/admob

          echo "========================================="
          echo "CAPACITOR PLUGINS"
          echo "========================================="

          npx cap ls

          npx cap init \
            "NEON DODGE" \
            "com.fxd.neondodge" \
            --web-dir=www

          npx cap add android


      # =====================================================
      # CONFIGURE ADMOB
      # =====================================================

      - name: Configure AdMob Android App ID
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          APP_ID = "ca-app-pub-7914086624525579~8190565290"

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          # =================================================
          # STRINGS.XML
          # =================================================

          strings_text = strings.read_text()

          admob_string = (
              f'<string name="admob_app_id">{APP_ID}</string>'
          )

          if 'name="admob_app_id"' in strings_text:

              strings_text = re.sub(
                  r'<string\s+name="admob_app_id">.*?</string>',
                  admob_string,
                  strings_text
              )

          else:

              strings_text = strings_text.replace(
                  "</resources>",
                  f"    {admob_string}\n</resources>"
              )

          strings.write_text(strings_text)

          # =================================================
          # ANDROID MANIFEST
          # =================================================

          manifest_text = manifest.read_text()

          meta = """
          <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="@string/admob_app_id" />
          """

          if (
              "com.google.android.gms.ads.APPLICATION_ID"
              not in manifest_text
          ):

              manifest_text = manifest_text.replace(
                  "</application>",
                  f"{meta}\n    </application>"
              )

          manifest.write_text(manifest_text)

          print("AdMob App ID configured.")
          PY


      # =====================================================
      # VERIFY ADMOB CONFIGURATION
      # =====================================================

      - name: Verify AdMob configuration
        run: |
          set -e

          echo "========================================="
          echo "VERIFYING ADMOB CONFIGURATION"
          echo "========================================="

          echo ""
          echo "Package:"
          grep -R "com.fxd.neondodge" \
            android/app/src/main \
            android/app/build.gradle \
            android/app/build.gradle.kts \
            2>/dev/null || true

          echo ""
          echo "AdMob App ID:"
          grep -R \
            "ca-app-pub-7914086624525579~8190565290" \
            android/app/src/main \
            || true

          echo ""
          echo "AdMob APPLICATION_ID:"
          grep -R \
            "com.google.android.gms.ads.APPLICATION_ID" \
            android/app/src/main \
            || true

          echo ""
          echo "AdMob plugin:"
          npm list @capacitor-community/admob

          echo ""
          echo "Capacitor:"
          npx cap ls


      # =====================================================
      # COPY WEB FILES
      # =====================================================

      - name: Copy web files
        run: |
          set -e

          npx cap copy android


      # =====================================================
      # SYNC CAPACITOR
      # =====================================================

      - name: Sync Capacitor
        run: |
          set -e

          npx cap sync android


      # =====================================================
      # VERIFY AFTER SYNC
      # =====================================================

      - name: Verify Android after Capacitor sync
        run: |
          set -e

          echo "========================================="
          echo "ANDROID PROJECT AFTER SYNC"
          echo "========================================="

          echo ""
          echo "Capacitor plugins:"
          npx cap ls

          echo ""
          echo "AdMob classes:"
          find android \
            -type f \
            | grep -i "admob" \
            | head -50 || true

          echo ""
          echo "AdMob App ID:"
          grep -R \
            "ca-app-pub-7914086624525579~8190565290" \
            android/app/src/main \
            || true

          echo ""
          echo "APPLICATION_ID:"
          grep -R \
            "com.google.android.gms.ads.APPLICATION_ID" \
            android/app/src/main \
            || true


      # =====================================================
      # JAVA
      # =====================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # =====================================================
      # GRADLE
      # =====================================================

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew


      # =====================================================
      # CLEAN
      # =====================================================

      - name: Clean Android build
        run: |
          cd android
          ./gradlew clean


      # =====================================================
      # BUILD APK
      # =====================================================

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace


      # =====================================================
      # VERIFY APK
      # =====================================================

      - name: Verify APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================="
          echo "APK INFORMATION"
          echo "========================================="

          ls -lh "$APK"

          echo ""
          echo "APK SHA256:"

          sha256sum "$APK"


      # =====================================================
      # UPLOAD APK
      # =====================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DODGE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk