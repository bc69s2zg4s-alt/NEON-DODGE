name: Build NEON DODGE Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp game.js www/
          cp audio.js www/

      - name: Create Capacitor project
        run: |
          npm init -y

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/app

          npx cap init \
            "NEON DODGE" \
            "com.fxd.neondodge" \
            --web-dir=www

          npx cap add android
          npx cap copy android

      - name: Configure Android Deep Link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          # Ищем MainActivity
          pattern = re.compile(
              r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*)(>)',
              re.MULTILINE
          )

          match = pattern.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: MainActivity not found"
              )

          activity_start = match.start()

          activity_end = text.find(
              "</activity>",
              match.end()
          )

          if activity_end == -1:
              raise SystemExit(
                  "ERROR: MainActivity closing tag not found"
              )

          activity_block = text[
              activity_start:activity_end
          ]

          # singleTask нужен для корректного appUrlOpen
          if 'android:launchMode="singleTask"' not in activity_block:

              insert_pos = match.end()

              text = (
                  text[:insert_pos]
                  + '\n'
                  + '            android:launchMode="singleTask"'
                  + text[insert_pos:]
              )

              # заново ищем MainActivity
              match = pattern.search(text)

              activity_start = match.start()

              activity_end = text.find(
                  "</activity>",
                  match.end()
              )

              activity_block = text[
                  activity_start:activity_end
              ]

          # Deep Link
          deep_link = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />

                  <data
                      android:scheme="neondodge"
                      android:host="auth" />
              </intent-filter>
          '''

          if 'android:scheme="neondodge"' not in activity_block:

              text = (
                  text[:activity_end]
                  + deep_link
                  + "\n        "
                  + text[activity_end:]
              )

          manifest.write_text(text)

          print("")
          print("==========================================")
          print(" NEON DODGE DEEP LINK")
          print("==========================================")
          print("Scheme: neondodge")
          print("Host: auth")
          print("URL: neondodge://auth")
          print("Launch mode: singleTask")
          print("==========================================")
          print("")

          PY

      - name: Fix Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                      }
                  }
              }
          }

          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Clean Android build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DODGE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk